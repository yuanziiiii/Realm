name: Release Linux binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Test
        run: go test ./...
      - name: Build common release files
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "release/relay-agent-linux-$arch" ./cmd/relay-agent
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "release/relay-control-linux-$arch" ./cmd/relay-control
          done
          tar -czf release/relay-panel-source.tar.gz \
            app build db public worker scripts .openai \
            package.json package-lock.json \
            drizzle.config.ts eslint.config.mjs next-env.d.ts next.config.ts postcss.config.mjs tsconfig.json vite.config.ts \
            Dockerfile.web Dockerfile.control docker-compose.yml
          install -m 0755 scripts/update-agent.sh release/update-agent.sh
          install -m 0755 scripts/update-control.sh release/update-control.sh
          install -m 0755 scripts/update.sh release/update.sh
          install -m 0755 scripts/zf.sh release/zf.sh
          install -m 0755 scripts/reset-admin-password.sh release/reset-admin-password.sh
          install -m 0755 scripts/uninstall.sh release/uninstall.sh
          for file in release/*; do
            (cd release && sha256sum "${file#release/}") > "$file.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: common-release
          path: release/*
          compression-level: 0

  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build native ${{ matrix.arch }} images
        run: |
          mkdir -p release
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --tag "relay-panel-web-release:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            --output "type=docker,dest=release/relay-panel-web-linux-${{ matrix.arch }}.tar" \
            --file Dockerfile.web .
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg "VERSION=${GITHUB_REF_NAME#v}" \
            --tag "relay-panel-control-release:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            --output "type=docker,dest=release/relay-panel-control-linux-${{ matrix.arch }}.tar" \
            --file Dockerfile.control .
          gzip -1 "release/relay-panel-web-linux-${{ matrix.arch }}.tar"
          gzip -1 "release/relay-panel-control-linux-${{ matrix.arch }}.tar"
          for file in release/*; do
            (cd release && sha256sum "${file#release/}") > "$file.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.arch }}
          path: release/*
          compression-level: 0

  release:
    needs: [common, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: "images-*"
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
