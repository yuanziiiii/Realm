name: Release Linux binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Test
        run: go test ./...
      - name: Build Linux binaries
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "release/relay-agent-linux-$arch" ./cmd/relay-agent
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "release/relay-control-linux-$arch" ./cmd/relay-control
          done
          tar -czf release/relay-panel-source.tar.gz \
            app build db public worker .openai \
            package.json package-lock.json \
            drizzle.config.ts eslint.config.mjs next-env.d.ts next.config.ts postcss.config.mjs tsconfig.json vite.config.ts \
            Dockerfile.web Dockerfile.control docker-compose.yml
          install -m 0755 scripts/update-agent.sh release/update-agent.sh
          install -m 0755 scripts/update-control.sh release/update-control.sh
          install -m 0755 scripts/update.sh release/update.sh
          install -m 0755 scripts/zf.sh release/zf.sh
          install -m 0755 scripts/reset-admin-password.sh release/reset-admin-password.sh
          for file in release/*; do
            sha256sum "$file" > "$file.sha256"
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
